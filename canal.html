<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Canal Telegram</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1530;color:#fff;font-family:system-ui,sans-serif;padding:20px}
.c{width:100%;max-width:380px;background:#14234a;border-radius:20px;padding:32px 24px;text-align:center}
h1{font-size:22px;margin:0 0 8px;word-break:break-word}
p{margin:0 0 24px;color:#aab6d8}
a.b{display:block;background:linear-gradient(135deg,#2aa7ff,#1a6dff);color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:16px;border-radius:14px}
</style>
</head>
<body>
<div class="c" id="c"><p>Chargement…</p></div>
<script>
var SB = "https://ooccarepvhiqireyxjdl.supabase.co";
var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vY2NhcmVwdmhpcWlyZXl4amRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxODM2ODYsImV4cCI6MjEwODc1OTY4Nn0.vpNQIpfvyDn7ESEm9hLHMEsmFFzqIWb9YlDrL8YNyrg";
var box = document.getElementById("c");
function erreur(msg) {
  box.innerHTML = "";
  var h = document.createElement("h1"); h.textContent = "Lien invalide";
  var p = document.createElement("p"); p.textContent = (typeof msg === "string" && msg) ? msg : "Ce lien n'existe pas ou n'est plus valide.";
  box.appendChild(h); box.appendChild(p);
}
var code = (new URLSearchParams(location.search).get("c") || location.hash.replace("#", "")).trim();
if (!/^[a-z0-9]{6,32}$/i.test(code)) { erreur(); }
else {
  fetch(SB + "/rest/v1/rpc/canal_public", {
    method: "POST",
    headers: { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_code: code })
  }).then(function (r) {
    if (!r.ok) { throw new Error("Erreur serveur (" + r.status + ")"); }
    return r.json();
  }).then(function (d) {
    if (!d || !d[0] || !/^https:\/\/(t\.me|telegram\.me)\//i.test(d[0].lien)) { erreur(); return; }
    document.title = d[0].nom;
    box.innerHTML = "";
    var h = document.createElement("h1"); h.textContent = d[0].nom;
    var p = document.createElement("p"); p.textContent = "Canal Telegram";
    var a = document.createElement("a"); a.className = "b"; a.textContent = "Ouvrir";
    a.href = d[0].lien; a.rel = "noopener";
    box.appendChild(h); box.appendChild(p); box.appendChild(a);
  }).catch(function (e) { erreur(e && e.message ? e.message : "Connexion impossible."); });
}
</script>
</body>
</html>
